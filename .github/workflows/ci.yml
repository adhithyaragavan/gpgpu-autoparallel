name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    env:
      LLVM_VERSION: "22"   # match the development toolchain (Homebrew LLVM 22)
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM/Clang ${{ env.LLVM_VERSION }} and build tools
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$LLVM_VERSION"
          # clang-tools/libpolly/libclang-cpp: Debian's ClangConfig.cmake checks that
          # every exported target's files exist, and aborts find_package otherwise.
          sudo apt-get install -y -qq ninja-build \
            "libclang-$LLVM_VERSION-dev" "llvm-$LLVM_VERSION-dev" "llvm-$LLVM_VERSION-tools" \
            "clang-tools-$LLVM_VERSION" "libpolly-$LLVM_VERSION-dev" "libclang-cpp$LLVM_VERSION-dev" \
            "libomp-$LLVM_VERSION-dev"
          # Ubuntu 24.04's system Python is externally managed (PEP 668): no bare pip.
          pipx install lit

      - name: Build p05tool
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_PREFIX_PATH="/usr/lib/llvm-$LLVM_VERSION"
          ninja -C build

      - name: Verdict regression tests (lit + FileCheck)
        run: FILECHECK="/usr/lib/llvm-$LLVM_VERSION/bin/FileCheck" lit -v tests

      - name: Runtime check of SAFE verdicts (parallel vs sequential, bit-identical)
        run: CC="/usr/lib/llvm-$LLVM_VERSION/bin/clang" RUNS=20 scripts/check_parallel.sh
